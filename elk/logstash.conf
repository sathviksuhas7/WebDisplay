input {
  file {
    path => ["/var/log/webdisplay/*.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    codec => plain { charset => "UTF-8" }
  }
}

filter {
  mutate {
    add_field => {
      "application" => "WebDisplay"
      "environment" => "local"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "webdisplay-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
