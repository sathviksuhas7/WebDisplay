
input {
  file {
    path => ["/var/log/webdisplay/*.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"
    codec => plain {
      charset => "UTF-8"
    }
    type => "webdisplay"
  }

  file {
    path => ["/var/log/banking-app/*.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"
    codec => plain {
      charset => "UTF-8"
    }
    type => "banking-app"
  }
}

filter {
  if [type] == "webdisplay" {
    mutate {
      add_field => {
        "application" => "WebDisplay"
        "environment" => "local"
      }
    }
  } else if [type] == "banking-app" {
    mutate {
      add_field => {
        "application" => "BankingApp"
        "environment" => "local"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "application-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
