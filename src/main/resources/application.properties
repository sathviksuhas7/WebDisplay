spring.application.name=webdisplay
server.port=1111

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}



# Logging Configuration
logging.level.root=INFO
logging.level.com.epdcl.webdisplay=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Log File
logging.file.name=logs/webdisplay.log

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Session Configuration
server.servlet.session.timeout=2h

# Session Cookie Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# ID document upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Store documents outside the public web directory
app.document.upload-dir=${DOCUMENT_UPLOAD_DIR:${user.home}/webdisplay-secure-storage/id-documents}


# Development only: display OTP in Spring Boot console
app.profile-otp.log-code=${PROFILE_OTP_LOG_CODE:false}

# Secure document validation and fail-closed ClamAV scanning
app.document.scan.enabled=${DOCUMENT_SCAN_ENABLED:true}
app.document.scan.clamav-host=${CLAMAV_HOST:127.0.0.1}
app.document.scan.clamav-port=${CLAMAV_PORT:3310}
app.document.scan.timeout-ms=${CLAMAV_TIMEOUT_MS:10000}

# n8n customer AI assistant (set both environment variables to enable)
app.ai.n8n.webhook-url=${N8N_AI_WEBHOOK_URL:}
app.ai.n8n.shared-secret=${N8N_AI_SHARED_SECRET:}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
