spring.application.name=webdisplay
server.port=1111

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Logging Configuration
logging.level.root=INFO
logging.level.com.epdcl.webdisplay=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Log File
logging.file.name=logs/webdisplay.log

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Session Configuration
server.servlet.session.timeout=2h

# Session Cookie Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# ID document upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Store documents outside the public web directory
app.document.upload-dir=${DOCUMENT_UPLOAD_DIR:${user.home}/webdisplay-secure-storage/id-documents}


# Development only: display OTP in Spring Boot console
app.profile-otp.log-code=true
